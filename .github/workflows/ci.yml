name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests (all external services mocked)
        env:
          ANTHROPIC_API_KEY: ""
        run: pytest --maxfail=5
      - name: Validate Kubernetes manifests are well-formed YAML
        run: python -c "import yaml,glob;[list(yaml.safe_load_all(open(f))) for f in glob.glob('kubernetes/*.yaml')];print('manifests ok')"
